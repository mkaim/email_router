services:
  app:
    image: app:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      OPENAI_BASE_URL: http://llm:8080/v1
      OPENAI_API_KEY: dummy
      OPENAI_MODEL: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      OPENAI_TEMPERATURE: 0.2
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
    depends_on:
      - smtp
      - llm

  smtp:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
  
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - llm-models:/models
    command:
      - -hf
      - Qwen/Qwen2.5-1.5B-Instruct-GGUF
      - --jinja
      - --models-dir
      - /models
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --reasoning
      - off
    gpus: all

volumes:
  llm-models:
