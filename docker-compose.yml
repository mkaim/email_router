x-llm-model: &llm_model qwen3:4b-instruct-2507-q4_K_M

services:
  app:
    image: app:latest
    build: .
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      HOST: "${APP_HOST:-0.0.0.0}"
      PORT: "${APP_PORT:-8000}"
      LLM_BASE_URL: http://llm:11434/v1
      LLM_API_KEY: dummy
      LLM_MODEL: *llm_model
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
    depends_on:
      smtp:
        condition: service_healthy
      llm:
        condition: service_healthy

  smtp:
    image: mailhog/mailhog
    ports:
      # Web UI for inspecting routed mail; SMTP (1025) stays internal.
      - "8025:8025"
    healthcheck:
      # MailHog runs SMTP and the HTTP API in one process, so a reachable
      # HTTP API means the SMTP listener is up too.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v2/messages"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm:
    image: ollama/ollama:latest
    environment:
      LLM_MODEL: *llm_model
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      # Published for local LLM tests / inspection; the app reaches it internally.
      - "${LLM_PORT:-11434}:11434"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Starting Ollama..."
        ollama serve &
        OLLAMA_PID=$$!

        echo "Waiting for Ollama API..."
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done

        echo "Pulling model: $$LLM_MODEL"
        ollama pull "$$LLM_MODEL"

        echo "Warming up model: $$LLM_MODEL"
        ollama run "$$LLM_MODEL" "just answer single word: PING" >/dev/null 2>&1 || true

        echo "Model $$LLM_MODEL is ready"

        wait $$OLLAMA_PID
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama ps | awk 'NR > 1 {print $$1}' | grep -Fxq \"$$LLM_MODEL\""
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    gpus: all
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
