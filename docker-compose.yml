services:
  app:
    image: app:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      OPENAI_BASE_URL: http://llm:8080/v1
      OPENAI_API_KEY: dummy
      OPENAI_MODEL: &hf_model Qwen/Qwen2.5-1.5B-Instruct-GGUF
      OPENAI_TEMPERATURE: 0.2
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
    depends_on:
      - smtp
      - llm

  smtp:
    image: mailhog/mailhog
    ports:
      # Web UI for inspecting routed mail; SMTP (1025) stays internal.
      - "8025:8025"

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - llm-models:/models
    command:
      - -hf
      - *hf_model
      - --jinja
      - --models-dir
      - /models
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --reasoning
      - off
    gpus: all

volumes:
  llm-models:
