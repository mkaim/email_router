services:
  app:
    image: app:latest
    build: .
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      HOST: "${APP_HOST:-0.0.0.0}"
      PORT: "${APP_PORT:-8000}"
      LLM_BASE_URL: http://llm:11434/v1
      LLM_API_KEY: dummy
      LLM_MODEL: &ollama_model qwen2.5:1.5b-instruct
      SMTP_HOST: smtp
      SMTP_PORT: "1025"
    depends_on:
      smtp:
        condition: service_healthy
      llm-pull:
        condition: service_completed_successfully

  smtp:
    image: mailhog/mailhog
    ports:
      # Web UI for inspecting routed mail; SMTP (1025) stays internal.
      - "8025:8025"
    healthcheck:
      # MailHog runs SMTP and the HTTP API in one process, so a reachable
      # HTTP API means the SMTP listener is up too.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v2/messages"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm:
    image: ollama/ollama
    command: ["serve"]
    environment:
      # Bind 0.0.0.0 so the app container can reach the server on the network.
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # `ollama list` succeeds once the server is listening; the model itself
      # is downloaded by the one-shot `llm-pull` service below.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    gpus: all

  llm-pull:
    image: ollama/ollama
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://llm:11434
    command: ["pull", *ollama_model]
    restart: "no"

volumes:
  ollama:
